<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scan prix → € (v12: ILS + barre fixe + rendu)</title>
  <meta name="theme-color" content="#0b1220"/>
  <link rel="stylesheet" href="assets/styles.css">
  <script src="https://unpkg.com/tesseract.js@5.1.0/dist/tesseract.min.js" crossorigin="anonymous" defer></script>
  <script src="assets/main.js" defer></script>
</head>
<body>
  <header>
    <div class="hdr-left">
      <button id="startBtn" aria-pressed="false">Activer la caméra</button>
      <span id="camState" class="muted">Caméra : inactif</span>
    </div>
    <div class="hdr-right">
      <button id="helpBtn" title="Aide rapide">❔</button>
    </div>
  </header>

  <main>
    <section class="card">
      <div id="err" role="alert" aria-live="polite"></div>
      <div id="wrap">
        <video id="preview" playsinline aria-hidden="false"></video>
        <canvas id="frame" hidden></canvas>

        <div id="roiResult" role="status" aria-live="polite"></div>

        <div class="dock" id="dock" aria-hidden="false">
          <button id="zoomOut" class="iconBtn" title="Zoom -" aria-label="Zoom -">➖</button>
          <div id="zoomChip" class="chip" aria-live="polite">1.5×</div>
          <button id="zoomIn" class="iconBtn" title="Zoom +" aria-label="Zoom +">➕</button>
          <button id="presetFine" class="iconBtn" title="Ligne fine" aria-label="Ligne fine">≡</button>
          <button id="swapCur" class="iconBtn" title="Basculer EUR⇄CZK" aria-label="Basculer EUR⇄CZK">↔️</button>
          <button id="toggleFS" class="iconBtn" title="Plein écran" aria-label="Plein écran">⛶</button>
        </div>

        <button id="scanFloat" class="fab" title="Scanner" aria-label="Scanner">
          <span id="scanIcon">🔍</span>
          <span id="scanSpinner" class="spinner" hidden></span>
        </button>

        <svg id="overlay" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <mask id="cutout">
              <rect x="0" y="0" width="100" height="100" fill="white"/>
              <rect id="holeMask" x="14" y="45" width="72" height="10" fill="black" rx="3" ry="3"/>
            </mask>
          </defs>
          <rect x="0" y="0" width="100" height="100" class="veil" mask="url(#cutout)"/>
          <rect id="holeStroke" x="14" y="45" width="72" height="10" class="hole-stroke" rx="3" ry="3"/>
        </svg>

        <button id="roiHandle" aria-label="Déplacer la fenêtre"></button>
      </div>
    </section>

    <section class="card">
      <div class="controls">
        <div class="ctrl" title="Largeur fenêtre">
          <label for="roiW">Largeur</label>
          <input type="range" id="roiW" min="30" max="95" value="72"/>
        </div>
        <div class="ctrl" title="Hauteur fenêtre">
          <label for="roiH">Hauteur</label>
          <input type="range" id="roiH" min="4" max="18" value="10"/>
        </div>
        <div class="ctrl" title="Devise cible">
          <label for="target">Devise</label>
          <select id="target">
            <option value="EUR" selected>EUR (€)</option>
            <option value="CZK">CZK (Kč)</option>
            <option value="USD">USD ($)</option>
            <option value="GBP">GBP (£)</option>
            <option value="ILS">ILS (₪)</option>
          </select>
        </div>
        <div class="ctrl">
          <label for="tessLang">Langues OCR</label>
          <select id="tessLang">
            <option value="eng+fra" selected>eng+fra</option>
            <option value="eng">eng</option>
            <option value="fra">fra</option>
            <option value="deu">deu</option>
            <option value="spa">spa</option>
          </select>
        </div>
      </div>
    </section>

    <section class="card">
      <div id="output" class="muted">Aucune donnée scannée pour l’instant.</div>
      <div id="details" class="muted" style="font-size:.95rem"></div>
    </section>
  </main>

  <footer class="muted small">Usage local • images traitées en local • taux fournis par frankfurter.app</footer>
</body>
</html>
